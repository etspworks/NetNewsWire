<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Feature grid: local accounts, eight sync services, RSS Atom and JSON Feed, OPML, full-text search, folders and smart feeds, article themes, reader view, dark mode, landscape, launcher badge, background refresh">
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .h{font-size:15px;font-weight:700;letter-spacing:2.2px;fill:#8b98a8}
    .t{font-size:16.5px;font-weight:600;fill:#e6edf5}
    .s{font-size:12.5px;fill:#8b98a8}
    .g{fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect width="1200" height="460" rx="18" fill="#0f1620"/>
  <rect x="1" y="1" width="1198" height="458" rx="18" fill="none" stroke="#1f2a3a" stroke-width="2"/>
  <text class="f h" x="64" y="52">WHAT SHIPPED</text>

  <g id="tiles">
    <!-- row 1 -->
    <g transform="translate(64,74)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#2D80F1" opacity=".16"/>
      <g class="g" stroke="#5E9EF4"><circle cx="38" cy="33" r="6"/><path d="M28 47a10 10 0 0 1 20 0"/></g>
      <text class="f t" x="20" y="80">Local accounts</text>
      <text class="f s" x="20" y="97">No sign-in, feeds stay on device</text>
    </g>
    <g transform="translate(337,74)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#3fb950" opacity=".16"/>
      <g class="g" stroke="#3fb950"><path d="M30 44h16a7 7 0 0 0 .6-14 9 9 0 0 0-17 2.4A6 6 0 0 0 30 44z"/></g>
      <text class="f t" x="20" y="80">8 sync services</text>
      <text class="f s" x="20" y="97">Feedbin &#183; NewsBlur &#183; FreshRSS &#183; more</text>
    </g>
    <g transform="translate(610,74)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#d29922" opacity=".16"/>
      <g class="g" stroke="#d29922"><path d="M31 38a7 7 0 0 1 7 7"/><path d="M31 31a14 14 0 0 1 14 14"/></g>
      <circle cx="31.5" cy="44.5" r="2.4" fill="#d29922"/>
      <text class="f t" x="20" y="80">RSS &#183; Atom &#183; JSON Feed</text>
      <text class="f s" x="20" y="97">Parsers written from scratch</text>
    </g>
    <g transform="translate(883,74)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#a371f7" opacity=".16"/>
      <g class="g" stroke="#a371f7"><path d="M31 28h10l6 6v16H31z"/><path d="M41 28v6h6"/></g>
      <text class="f t" x="20" y="80">OPML</text>
      <text class="f s" x="20" y="97">Import and export the whole tree</text>
    </g>

    <!-- row 2 -->
    <g transform="translate(64,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#f778ba" opacity=".16"/>
      <g class="g" stroke="#f778ba"><circle cx="36" cy="35" r="7.5"/><path d="M42 41l6 6"/></g>
      <text class="f t" x="20" y="80">Full-text search</text>
      <text class="f s" x="20" y="97">SQLite index over every article</text>
    </g>
    <g transform="translate(337,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#5E9EF4" opacity=".16"/>
      <g class="g" stroke="#5E9EF4"><path d="M28 46V31h7l3 3h8v12z"/></g>
      <text class="f t" x="20" y="80">Folders &amp; smart feeds</text>
      <text class="f s" x="20" y="97">Today &#183; All Unread &#183; Starred</text>
    </g>
    <g transform="translate(610,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#3fb950" opacity=".16"/>
      <g class="g" stroke="#3fb950"><path d="M38 47a9 9 0 1 1 9-9c0 2.2-2 2.6-3.4 2.6h-2.2a2.6 2.6 0 0 0-1.6 4.6 1.7 1.7 0 0 1-1.8 1.8z"/></g>
      <circle cx="34" cy="34" r="1.7" fill="#3fb950"/><circle cx="40" cy="32" r="1.7" fill="#3fb950"/><circle cx="33" cy="41" r="1.7" fill="#3fb950"/>
      <text class="f t" x="20" y="80">Article themes</text>
      <text class="f s" x="20" y="97">Import .nnwtheme or .zip</text>
    </g>
    <g transform="translate(883,192)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#d29922" opacity=".16"/>
      <g class="g" stroke="#d29922"><path d="M30 31h16M30 37h16M30 43h10"/></g>
      <text class="f t" x="20" y="80">Reader view</text>
      <text class="f s" x="20" y="97">Mercury extraction, needs a key</text>
    </g>

    <!-- row 3 -->
    <g transform="translate(64,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#a371f7" opacity=".16"/>
      <g class="g" stroke="#a371f7"><path d="M44 41a9 9 0 1 1-9-12 7 7 0 0 0 9 12z"/></g>
      <text class="f t" x="20" y="80">Dark mode</text>
      <text class="f s" x="20" y="97">Full dark palette, icons included</text>
    </g>
    <g transform="translate(337,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#2D80F1" opacity=".16"/>
      <g class="g" stroke="#5E9EF4"><rect x="26" y="34" width="24" height="14" rx="3"/><path d="M30 30a10 10 0 0 1 16 0"/><path d="M46 25v5h-5"/></g>
      <text class="f t" x="20" y="80">Landscape</text>
      <text class="f s" x="20" y="97">460vp readable column cap</text>
    </g>
    <g transform="translate(610,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#f778ba" opacity=".16"/>
      <g class="g" stroke="#f778ba"><rect x="29" y="30" width="16" height="16" rx="4"/></g>
      <circle cx="46" cy="30" r="4.5" fill="#f778ba"/>
      <text class="f t" x="20" y="80">Launcher badge</text>
      <text class="f s" x="20" y="97">Live unread count on the icon</text>
    </g>
    <g transform="translate(883,310)">
      <rect width="253" height="102" rx="12" fill="#161e2b"/>
      <circle cx="38" cy="38" r="18" fill="#3fb950" opacity=".16"/>
      <g class="g" stroke="#3fb950"><circle cx="38" cy="38" r="9"/><path d="M38 33v5l3 3"/></g>
      <text class="f t" x="20" y="80">Polite refresh</text>
      <text class="f s" x="20" y="97">9-minute window, logged skips</text>
    </g>
